[package]
name = "dnsqry"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "dnsqry"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
hickory-resolver = { version = "0.26", default-features = false, features = ["https-ring", "system-config", "tokio", "webpki-roots"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
